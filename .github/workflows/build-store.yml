name: Build store.json

on:
  push:
    branches: [main]
    paths:
      - "android_apps/**"
      - "android_games/**"
      - "scripts/**"
      - ".github/workflows/build-store.yml"

permissions:
  contents: write

concurrency:
  group: build-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build_store.py exits 1 on a broken app.json, which fails the job.
      - name: Build the catalog
        run: python3 scripts/build_store.py

      - name: Check for store changes
        id: store_changes
        run: |
          previous=$(git show HEAD:store.json | jq -cS 'del(.generatedAt)')
          current=$(jq -cS 'del(.generatedAt)' store.json)
          if [[ "$previous" != "$current" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "store.json is already current."
          fi

      - name: Commit store.json
        if: steps.store_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store.json
          git commit -m "Rebuild store.json"
          git push
